<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Perpustakaan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="site-header">
        <h1>Perpustakaan Sekolah XYZ</h1>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="katalog.html">Katalog Buku</a></li>
                <li id="nav-auth"><a href="login.html">Masuk / Daftar</a></li>
            </ul>
        </nav>
    </header>
    <main class="auth-page">
        <div class="auth-card">
            <h2>Daftar Akun</h2>
            <form id="register-form">
                <label for="name">Nama</label>
                <input id="name" required>
                <label for="email">Email</label>
                <input type="email" id="email" required>
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" required>
                <label for="password2">Konfirmasi Kata Sandi</label>
                <input type="password" id="password2" required>
                <label for="admincode">Kode Admin (opsional)</label>
                <input id="admincode" placeholder="Isi 'ADMINKODE' untuk membuat akun admin">
                <button type="submit" class="btn-primary">Daftar</button>
            </form>
            <p class="muted">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
        </div>
    </main>
    <div id="toast" class="toast" aria-live="polite"></div>
    <script src="script.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', function(e){
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            const admincode = document.getElementById('admincode').value.trim();
            if(password !== password2) {
                showToast('Kata sandi tidak cocok', true);
                return;
            }
            const role = (admincode === 'ADMINKODE') ? 'admin' : 'user';
            const ok = registerUser({name, email, password, role});
            if(ok) {
                showToast('Pendaftaran berhasil. Silakan masuk.');
                setTimeout(()=> { window.location = 'login.html'; }, 900);
            } else {
                showToast('Email sudah terdaftar', true);
            }
        });
    </script>
</body>
</html>

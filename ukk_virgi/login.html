<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Perpustakaan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="site-header">
        <h1>Perpustakaan Sekolah Nelita</h1>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="katalog.html">Katalog Buku</a></li>
                <li id="nav-auth"><a href="login.html">Masuk / Daftar</a></li>
            </ul>
        </nav>
    </header>
    <main class="auth-page">
        <div class="auth-card">
            <h2>Masuk</h2>
            <form id="login-form">
                <label for="email">Email</label>
                <input type="email" id="email" required>

                <label for="password">Kata Sandi</label>
                <input type="password" id="password" required>

                <button type="submit" class="btn-primary">Masuk</button>
            </form>
            <p class="muted">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
            <p class="muted small">Demo admin: <code>admin@admin.com</code> / <code>admin123</code></p>
        </div>
    </main>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script src="script.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e){
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const ok = loginUser(email, password);
            if(ok) {
                showToast('Berhasil masuk. Mengarahkan...');
                setTimeout(()=> { window.location = 'index.html'; }, 900);
            } else {
                showToast('Email atau kata sandi salah', true);
            }
        });
    </script>
</body>
</html>
